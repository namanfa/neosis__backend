<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neosis</title>
    <meta name="application-name" content="Neosis">
    <meta name="description" content="Neosis image labeling, testing, packshot, and extraction workflows.">

    <link rel="icon" type="image/svg+xml" href="/logo/neosis-mark.svg">
    <script>
        (function(){var t=null;try{t=localStorage.getItem("neosis-theme")}catch(e){}if(!t)t="light";document.documentElement.dataset.theme=t})();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Pin the browser runtime so cached or upstream releases cannot change app behavior unexpectedly. -->
    <script>window.NEOSIS_BRAND_NAME = "Neosis";</script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for JSX transpilation in the browser -->
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>

    <!-- Deployment & Backend Configuration -->
    <script>
        window.NOESIS_API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:7860/api/sessions"
            : `${window.location.origin}/api/sessions`;

        // Keep-alive ping: automatically pings /health every 10 minutes while tab is open
        (function keepAlive() {
            const healthUrl = window.NOESIS_API_URL.replace('/api/sessions', '/health');
            setInterval(() => {
                fetch(healthUrl, { method: 'GET', mode: 'cors' }).catch(() => {});
            }, 10 * 60 * 1000);
        })();
    </script>


    <style>
        :root { --bg:#F8FAFC;--surface:#FFFFFF;--surface-2:#F8FAFC;--surface-3:#F1F5F9;--border:#E2E8F0;--border-strong:#CBD5E1;--text:#0F172A;--text-2:#475569;--text-3:#64748B;--primary:#5545F5;--primary-hover:#4338CA;--primary-soft:#EEEDFF;--on-primary:#FFFFFF;--success:#12805C;--success-soft:#E3F5EE;--warn:#B45309;--warn-soft:#FEF3E2;--warn-line:#F1D9A8;--danger:#C62828;--danger-soft:#FDE9E9;--shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.04);--focus:0 0 0 3px rgba(85,69,245,.35); }
        :root[data-theme="dark"] { --bg:#0F172A;--surface:#172033;--surface-2:#1B2640;--surface-3:#222F4D;--border:#27344F;--border-strong:#3A4A6C;--text:#F1F5F9;--text-2:#CBD5E1;--text-3:#94A3B8;--primary:#8F85FF;--primary-hover:#A8A0FF;--primary-soft:#27235F;--on-primary:#12104A;--success:#4CD6A0;--success-soft:#0F3329;--warn:#F5B454;--warn-soft:#3A2A10;--warn-line:#5A4318;--danger:#FF8A8A;--danger-soft:#3A1818;--shadow:none;--focus:0 0 0 3px rgba(143,133,255,.5); }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px 'Plus Jakarta Sans', system-ui, sans-serif;
            font-variant-numeric: tabular-nums;
        }
        #app-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #475569;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #CBD5E1;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="app-loader">
            <div class="spinner"></div>
            <div style="font-weight: 600; font-size: 15px;">Loading Neosis...</div>
        </div>
    </div>

    <script>
        function currentNextPath() { return window.location.pathname + window.location.search + window.location.hash; }
        (async function() {
            try {
                const authResponse = await fetch("/auth/me", { credentials: "same-origin" });
                if (authResponse.status === 401) {
                    window.location.replace("/login?next=" + encodeURIComponent(currentNextPath()));
                    return;
                }
                if (!authResponse.ok) throw new Error("Could not check your sign-in status.");
                window.IR_USER = await authResponse.json();
                const nativeFetch = window.fetch.bind(window);
                window.fetch = function(input, options) {
                    const requestUrl = typeof input === "string" ? input : input.url;
                    return nativeFetch(input, Object.assign({ credentials: "same-origin" }, options || {})).then(function(response) {
                        let parsed;
                        try { parsed = new URL(requestUrl, window.location.href); } catch (_) {}
                        if (response.status === 401 && parsed && parsed.origin === window.location.origin && parsed.pathname.startsWith("/api/")) {
                            window.location.assign("/login?expired=1&next=" + encodeURIComponent(currentNextPath()));
                        }
                        return response;
                    });
                };
                const [toolkitResponse, response] = await Promise.all([
                    fetch("/ToolkitPages.jsx"),
                    fetch("/SKULabeler.jsx")
                ]);
                if (!toolkitResponse.ok) throw new Error("Failed to load toolkit pages: " + toolkitResponse.status + " " + toolkitResponse.statusText);
                if (!response.ok) throw new Error("Failed to load application source: " + response.status + " " + response.statusText);
                const [toolkitSource, jsxSource] = await Promise.all([toolkitResponse.text(), response.text()]);
                const toolkitCompiled = Babel.transform(toolkitSource, { presets: [['react', { runtime: 'classic' }]] }).code;
                new Function(toolkitCompiled)();

                const compiled = Babel.transform(jsxSource, { presets: [['react', { runtime: 'classic' }]] }).code;
                new Function(compiled)();
            } catch (err) {
                console.error("Initialization error:", err);
                const root = document.getElementById("root");
                if (root) {
                    root.innerHTML = `
                        <div style="padding: 40px; max-width: 800px; margin: 40px auto; background: #FFF; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: monospace;">
                            <h2 style="color: #DC2626; margin-top: 0;">Application Startup Error</h2>
                            <p style="color: #475569; font-size: 14px;">An error occurred while compiling or mounting the interface:</p>
                            <pre style="background: #FEE2E2; color: #991B1B; padding: 16px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap;">${err.stack || err.message || err}</pre>
                        </div>
                    `;
                }
            }
        })();
    </script>
</body>
</html>
