<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noesis — Self-Labelling Tool</title>
    <meta name="description" content="Noesis is a free, browser-based AI dataset labelling tool powered by YOLO. Upload your images and .pt model — the backend handles all inference.">

    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel for JSX transpilation in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Deployment & Backend Configuration -->
    <!-- ⚠️  UPDATE THIS URL after deploying the HF Spaces backend -->
    <script>
        window.NOESIS_API_URL = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
            ? "http://localhost:7860/api/sessions"
            : "https://snaman0-noesis-backend.hf.space/api/sessions";

        // Keep-alive ping: automatically pings /health every 10 minutes while tab is open
        (function keepAlive() {
            const healthUrl = window.NOESIS_API_URL.replace('/api/sessions', '/health');
            setInterval(() => {
                fetch(healthUrl, { method: 'GET', mode: 'cors' }).catch(() => {});
            }, 10 * 60 * 1000);
        })();
    </script>


    <style>
        body {
            margin: 0;
            padding: 0;
            background: #F0F4F9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #app-loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #475569;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #CBD5E1;
            border-top: 4px solid #2563EB;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="app-loader">
            <div class="spinner"></div>
            <div style="font-weight: 600; font-size: 15px;">Loading Noesis SKU Labeler...</div>
        </div>
    </div>

    <script>
        (async function() {
            try {
                const response = await fetch("SKULabeler.jsx");
                if (!response.ok) {
                    throw new Error("Failed to load application source: " + response.status + " " + response.statusText);
                }
                const jsxSource = await response.text();
                // Transpile using classic JSX runtime to avoid ES module import injection
                const compiled = Babel.transform(jsxSource, {
                    presets: [
                        ['react', { runtime: 'classic' }]
                    ]
                }).code;
                
                // Execute compiled React app
                const runScript = new Function(compiled);
                runScript();
            } catch (err) {
                console.error("Initialization error:", err);
                const root = document.getElementById("root");
                if (root) {
                    root.innerHTML = `
                        <div style="padding: 40px; max-width: 800px; margin: 40px auto; background: #FFF; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: monospace;">
                            <h2 style="color: #DC2626; margin-top: 0;">Application Startup Error</h2>
                            <p style="color: #475569; font-size: 14px;">An error occurred while compiling or mounting the interface:</p>
                            <pre style="background: #FEE2E2; color: #991B1B; padding: 16px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap;">${err.stack || err.message || err}</pre>
                        </div>
                    `;
                }
            }
        })();
    </script>
</body>
</html>
