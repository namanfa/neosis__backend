<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · Neosis</title>
  <link rel="icon" type="image/svg+xml" href="/logo/neosis-mark.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html{color-scheme:light}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:#10132E;color:#0F172A;font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px}
    .card{width:100%;max-width:413px;padding:46px 36px 29px;border:0;border-radius:22px;background:#fff;color:#0F172A;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.28)}.mark{display:block;width:42px;height:42px;margin:0 auto}.title{margin:28px 0 8px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.025em}.sub{margin:0 0 26px;color:#64748B;font-size:14px;line-height:1.45}.google{width:100%;min-height:54px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid #CBD5E1;border-radius:10px;background:#fff;color:#0F172A;font:600 14px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}.google:hover{background:#F8FAFC;border-color:#5545F5;box-shadow:0 2px 10px rgba(85,69,245,.15)}.google:active{background:#EEEDFF}.google:focus-visible,.retry:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(85,69,245,.35)}.google:disabled{opacity:.7;cursor:wait}.g{width:22px;height:22px}.note{margin:16px 0 0;color:#64748B;font-size:13px;line-height:1.5}.alert{width:100%;margin:0 0 10px;padding:10px 12px;border:1px solid #C62828;border-radius:10px;background:#FDE9E9;color:#C62828;font-size:12px;line-height:1.5;text-align:left}.retry{display:inline-block;margin:0 auto 10px;padding:4px 10px;border:0;background:transparent;color:#5545F5;font:700 12px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer}.foot{width:100%;margin-top:28px;padding-top:18px;border-top:1px solid #E2E8F0;display:flex;align-items:center;justify-content:center;gap:8px;color:#8792A7;font-size:12px}.foot img{width:20px;height:20px;flex:none;object-fit:cover;object-position:left center}.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:520px){body{padding:16px}.card{max-width:413px;padding:40px 25px 25px;border-radius:20px}.title{font-size:25px}.sub{font-size:15px}.google{min-height:56px;font-size:14px}.note{font-size:13px}.foot{margin-top:24px;padding-top:16px;font-size:13px}}@media(max-width:380px){.card{padding:34px 18px 23px}.title{font-size:23px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="card" aria-labelledby="title">
    <img class="mark" src="/logo/neosis-mark.svg" alt="">
    <h1 class="title" id="title">Welcome to Neosis</h1>
    <p class="sub">Sign in with your work account to continue.</p>
    <div class="alert" id="alert" role="alert" aria-live="polite" hidden></div>
    <button class="retry" id="retry" type="button" hidden>Try again</button>
    <button class="google" id="google" type="button">
      <svg class="g" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15z"/><path fill="#34A853" d="M24 44c5.6 0 10.3-1.9 13.7-5.1L31 33.8c-1.9 1.3-4.2 2-7 2-5.4 0-10-3.7-11.7-8.6H5.4v5.3A20 20 0 0 0 24 44z"/><path fill="#FBBC05" d="M12.3 27.2a12 12 0 0 1 0-7.5v-5.3H5.4a20 20 0 0 0 0 18z"/><path fill="#EA4335" d="M24 11.1c3.1 0 5.9 1.1 8.1 3.2l6.1-6.1C34.5 4.9 29.7 3 24 3A20 20 0 0 0 5.4 14.4l6.9 5.3c1.7-4.9 6.3-8.6 11.7-8.6z"/></svg>
      <span id="button-label">Continue with Google</span>
    </button>
    <p class="note">Access is limited to FieldAssist and Flick2know accounts.</p>
    <footer class="foot"><img src="/logo/FieldAssistLogoColoured.svg" alt=""><span>© 2026 FieldAssist</span></footer>
  </main>
  <script>
    const qs=new URLSearchParams(location.search), alertBox=document.getElementById('alert'), retry=document.getElementById('retry');
    const messages={access_denied:'This Google account is not approved to use this tool. Switch to an approved account and try again.',invalid_state:'The sign-in request expired or could not be verified. Please try again.',google_error:'Google could not complete sign-in. Please try again.',token_exchange:'Google sign-in could not be completed. Please try again.',verification_failed:'We could not verify the Google account. Please try again.',unverified_email:'Google did not confirm this account?s email address. Sign in with a verified account.',redirect_uri_mismatch:'Google sign-in is misconfigured on this server. The redirect URL must match the Google Cloud Console setting.',invalid_code:'The Google sign-in code expired or was already used. Please start again.',google_unreachable:'Google sign-in is temporarily unavailable. Please try again.',not_configured:'Google sign-in has not been configured on this server yet.',rate_limited:'Too many sign-in attempts. Wait a few minutes, then try again.'};
    if(qs.has('expired')){alertBox.textContent='Your session has expired. Sign in again.';alertBox.hidden=false;retry.hidden=false}
    else if(qs.has('signed_out')){alertBox.textContent='You have been signed out.';alertBox.hidden=false}
    else if(qs.has('error')){alertBox.textContent=messages[qs.get('error')]||'Sign-in failed. Please try again.';alertBox.hidden=false;retry.hidden=false;if(qs.get('error')==='access_denied')retry.textContent='Try another account'}
    function nextPath(){let n=qs.get('next')||'/#/';if(location.hash&&(!n||n==='/'))n='/'+location.hash;if(!n.startsWith('/')||n.startsWith('//')||n.includes('\\'))n='/#/';return n}
    document.getElementById('google').addEventListener('click',function(){const button=this;button.disabled=true;document.getElementById('button-label').textContent='Redirecting to Google…';button.insertAdjacentHTML('beforeend','<span class="spin" aria-hidden="true"></span>');location.href='/auth/login?next='+encodeURIComponent(nextPath())});
    retry.addEventListener('click',()=>document.getElementById('google').click());
  </script>
</body>
</html>
